<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Alerta Remoto</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>🔔 Alerta Remoto</h1>
    <div class="status">
      <span id="statusDot" class="dot offline"></span>
      <span id="statusText">Conectando...</span>
    </div>
  </header>

  <div id="latencyBar" class="latency-bar hidden"></div>

  <main>
    <section id="dashboardSection" class="card">
      <p class="hint" id="noButtonsHint">Nenhum botão cadastrado ainda. Peça ao administrador para adicionar um.</p>
      <div id="buttonsGrid" class="buttons-grid"></div>
    </section>

    <div id="toast" class="toast hidden"></div>
  </main>

  <script src="/socket.io/socket.io.js"></script>
  <script src="app.js"></script>
</body>
</html>
